    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; }
        body, html { background-color: var(--bg); color: var(--text); overflow: hidden; height: 100dvh; width: 100%; font-family: sans-serif; margin: 0; padding: 0; touch-action: pan-y; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        #root { width: 100%; height: 100%; }
        .btn-large { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 1rem; transition: all 0.15s ease-in-out; background-color: var(--surface); border: 2px solid #334155; position: relative; }
        .btn-large:active { transform: scale(0.95); }
        .btn-large:focus, button:focus, select:focus { outline: 4px solid #fbbf24; z-index: 50; }
        #settings-panel { transition: transform 0.3s ease-in-out, width 0.3s ease-in-out; }
        #settings-panel.collapsed { transform: translateX(-100%); width: 0; padding: 0; margin: 0; overflow: hidden; border: none; }
        .control-panel { background-color: rgba(30, 41, 59, 0.95); backdrop-filter: blur(8px); }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: #cbd5e1; border-radius: 4px; outline: none; margin: 12px 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; background: #3b82f6; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .key-guide { position: absolute; top: 0.25rem; right: 0.5rem; font-size: 9px; background-color: rgba(0,0,0,0.6); color: #facc15; padding: 0 4px; border-radius: 4px; border: 1px solid rgba(250, 204, 21, 0.3); font-family: monospace; pointer-events: none; }
        .key-guide-inline { font-size: 9px; background-color: rgba(0,0,0,0.6); color: #facc15; padding: 0 4px; border-radius: 4px; border: 1px solid rgba(250, 204, 21, 0.3); font-family: monospace; margin-left: 6px; pointer-events: none; display: inline-block; vertical-align: middle; }
        .key-guide-dark { background-color: rgba(0,0,0,0.8); color: #ffffff; border: 1px solid rgba(0,0,0,0.5); }
        .hide-shortcuts .key-guide, .hide-shortcuts .key-guide-inline, .hide-shortcuts .key-guide-dark { display: none !important; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        .layout-transition { transition: all 0.3s ease-in-out; }
        @keyframes animTap { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(0.9); } }
        .anim-tap { animation: animTap 1.2s infinite; font-size: 2.5rem; display: inline-block; }
    </style>

class ErrorBoundary extends Component {

const formatNoteStr = (text) => {
    if (!text) return text;
    const parts = text.split(/(♯|♭|x|♮)/g);
    return parts.map((part, i) => /^(♯|♭|x|♮)$/.test(part) ? <span key={i} className="text-[0.65em] align-top opacity-90 mx-[1px]">{part}</span> : part);
};

// カード表示の部品（後ほどspeechやmusicの関数と連携します）
const CardDisplay = ({ info, playMode, isLeft }) => {
    if (info.isRest) return <span className="font-bold text-slate-400 text-center w-full block">休符</span>;

                {info.graceNotes && info.graceNotes.length > 0 && (

// speech_engine.js

const announce = (setAnnounceText, text) => { setAnnounceText(""); setTimeout(() => setAnnounceText(text), 50); };

const speak = (text, tempo = 100) => {
    return new Promise((resolve) => {
        if (!text) return resolve();
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.rate = 1.1 * (tempo / 100);
        u.onend = resolve; u.onerror = resolve;
        window.speechSynthesis.speak(u);
    });
};

const formatPitchWithMode = (pitchStr, octaveMode, dict) => {
    if (!pitchStr || pitchStr === "REST") return { disp: "休符", speech: "きゅうふ", isRest: true };
    const match = pitchStr.match(/([A-G])([#b]*)(-?\d+)/);
    if (!match) return { disp: pitchStr, speech: pitchStr, isRest: false };
    const noteEng = match[1]; const acc = match[2]; const oct = parseInt(match[3] || "4", 10);
    
    if (octaveMode === "①C4（数字式）") {
        const numEngDict = {'1':'ワン','2':'ツー','3':'スリー','4':'フォー','5':'ファイブ','6':'シックス','7':'セブン','8':'エイト'};
        const engSpeechDict = {'C':'シー','D':'ディー','E':'イー','F':'エフ','G':'ジー','A':'エー','B':'ビー'};
        let accSpeech = acc.includes('#') ? "、しゃーぷ" : (acc.includes('b') ? "、ふらっと" : "");
        return { disp: `${noteEng}${acc.replace(/#/g,'♯').replace(/b/g,'♭')}${oct}`, speech: `${engSpeechDict[noteEng] || noteEng}${accSpeech}、${numEngDict[oct] || oct}`, isRest: false };
    } else if (octaveMode === "②一点ハ（日本式）") {
        const jaBaseDict = {'C':'ハ','D':'ニ','E':'ホ','F':'ヘ','G':'ト','A':'イ','B':'ロ'};
        const jaSpeechDict = {'C':'は','D':'に','E':'ほ','F':'へ','G':'と','A':'イ','B':'ろ'};
        let accJa = acc === '#' ? "嬰" : (acc === 'b' ? "変" : "");
        let accSpeech = acc === '#' ? "えい" : (acc === 'b' ? "へん" : "");
        const ittenPrefixDisp = {1:"下二点", 2:"下一点", 3:"大字", 4:"一点", 5:"二点", 6:"三点", 7:"四点", 8:"五点"}[oct] || `${oct}点`;
        const ittenPrefixSpeech = {1:"しもにてん", 2:"しもいってん", 3:"おおもじ", 4:"いってん", 5:"にてん", 6:"さんてん", 7:"よんてん", 8:"ごてん"}[oct] || `${oct}てん`;
        return { disp: `${ittenPrefixDisp}${accJa}${jaBaseDict[noteEng] || noteEng}`, speech: `${ittenPrefixSpeech}、${accSpeech}${jaSpeechDict[noteEng] || noteEng}`, isRest: false };
    } else {
        let baseDisp = dict.PITCH[noteEng]?.disp || noteEng; 
        let baseSpeech = dict.PITCH[noteEng]?.speech || noteEng; 
        let accDisp = acc === '#' ? "♯" : (acc === 'b' ? "♭" : "");
        let accSpeech = acc === '#' ? "、しゃーぷ" : (acc === 'b' ? "、ふらっと" : "");
        return { disp: `${baseDisp}${accDisp}`, speech: `${baseSpeech}${accSpeech}`, isRest: false };
    }
};

const parseMusicData = (rawData, relData, octaveMode, dict, playMode) => {
    if (!rawData || !rawData.pitches || rawData.pitches[0] === "REST") return { isRest: true, prefix: "", notes: [], graceNotes: [], suffix: "", speech: "きゅうふ" };
    
    // getMidiNoteは外部(music_engine)から呼ぶ想定ですが、補助的にここに定義するか外部参照します
    const getMidi = (p) => {
        const m = p.match(/([A-G])([#b]*)(-?\d+)/);
        if(!m) return -1;
        const b = { 'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11 }[m[1]];
        let n = b + (parseInt(m[3] || "4", 10) + 1) * 12;
        if (m[2].includes('#')) n += m[2].length;
        if (m[2].includes('b')) n -= m[2].length;
        return n;
    };

    let sortedPitches = [...rawData.pitches];
    if (sortedPitches.length > 1) sortedPitches.sort((a, b) => getMidi(a) - getMidi(b));
    let dispP = []; let speechP = [];
    sortedPitches.forEach(p => { 
        const f = formatPitchWithMode(p, octaveMode, dict); 
        dispP.push(f.disp); speechP.push(f.speech); 
    });
    
    let prefix = "";
    if (octaveMode === "③中央ド（オリジナル）" && relData?.disp) prefix += relData.disp + " ";
    
    let graceNotes = []; let graceSpeech = "";
    if (rawData.graceNotes?.length > 0) {
        graceNotes = rawData.graceNotes.map(g => formatPitchWithMode(g, octaveMode, dict));
        graceSpeech = `そうしょくおん、${graceNotes.map(g=>g.speech).join('')}をひいてから、`;
    }

    let pitchSpeechStr = graceSpeech + (rawData.isChord || sortedPitches.length > 1 ? "わおん、" : "") + speechP.join('、');
    if (octaveMode === "③中央ド（オリジナル）" && relData?.speech) pitchSpeechStr = relData.speech + pitchSpeechStr;
    
    const durationStr = rawData.duration || "";
    const isDot = durationStr.startsWith("DOT_");
    const dInfo = dict.LENGTH[durationStr.replace("DOT_", "")] || { disp: "", speech: "" };
    let lengthDispStr = (rawData.dotCount > 0 || isDot ? "付点" : "") + dInfo.disp;
    let lengthSpeechStr = (dInfo.speech || "").replace(/8分音符/g, "8ぶおんぷ").replace(/はちぶおんぷ/g, "8ぶおんぷ");
    
    if (rawData.tupletValue) { lengthSpeechStr = `${rawData.tupletValue === 3 ? "さん" : (rawData.tupletValue === 6 ? "ろく" : rawData.tupletValue)}れんぷの、${lengthSpeechStr}`; lengthDispStr = `${rawData.tupletValue}連符 ` + lengthDispStr; }
    if (rawData.dotCount === 1 && !isDot) lengthSpeechStr = "ふてんの、" + lengthSpeechStr;
    if (rawData.dotCount === 2) lengthSpeechStr = "ふくふてん２つの、" + lengthSpeechStr;
    if (rawData.hasFermata) { lengthSpeechStr += "、フェルマータ"; lengthDispStr += "(フェルマータ)"; }

    let finalSpeech = `${pitchSpeechStr}、${lengthSpeechStr}`;
    const tieData = rawData.tie;
    if (tieData === "start" || (Array.isArray(tieData) && tieData.includes("start"))) finalSpeech = `${pitchSpeechStr}、タイでのばす、${lengthSpeechStr}`;
    else if (tieData === "continue" || tieData === "stop" || (Array.isArray(tieData) && (tieData.includes("continue") || tieData.includes("stop")))) finalSpeech = `タイで伸ばしている、${lengthSpeechStr}、${pitchSpeechStr}`;
    
    if (playMode === "①音名のみ") finalSpeech = pitchSpeechStr; 
    
    return { isRest: false, prefix: prefix.trim(), graceNotes: graceNotes, notes: dispP, suffix: lengthDispStr, speech: finalSpeech };

const getMidiNote = (pitchStr) => {
    if (!pitchStr || pitchStr === "REST") return -1;
    const match = pitchStr.match(/([A-G])([#b]*)(-?\d+)/);
    if (!match) return -1; 
    const baseNotes = { 'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11 };
    let note = baseNotes[match[1]];
    const acc = match[2];
    if (acc.includes('#')) note += acc.length;
    if (acc.includes('b')) note -= acc.length;
    return (parseInt(match[3] || "4", 10) + 1) * 12 + note;
};

const getDurationQ = (raw) => {
    if (!raw || !raw.duration) return 0;
    const durMap = { 'whole': 4.0, 'half': 2.0, 'quarter': 1.0, 'eighth': 0.5, '16th': 0.25, '32nd': 0.125 };
    const baseDurStr = raw.duration.replace("DOT_", "");
    let val = durMap[baseDurStr] || 1.0;
    if (raw.duration.startsWith("DOT_") || raw.dotCount > 0) val *= 1.5;
    if (raw.tupletValue) val *= (2 / raw.tupletValue); 
    return val;
};

const playMetronome = (audioCtx, isStrong, time, activeOscs) => {

    if (isStrong) { osc.frequency.setValueAtTime(1046.50, time); gain.gain.setValueAtTime(0.15, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3); } 
    else { osc.frequency.setValueAtTime(880, time); gain.gain.setValueAtTime(0.08, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1); }
    osc.start(time); osc.stop(time + 0.3);
    activeOscs.push(osc); 
};

const playSynthNote = (audioCtx, midi, time, volBalance, duration = 1.6, isLeft = false, activeOscs) => {
    if (!audioCtx) return;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0, time);
    let volMulti = isLeft ? ((100 - volBalance) / 50) : (volBalance / 50);
    const peakVol = (isLeft ? 0.3 : 0.1) * volMulti;
    if (peakVol <= 0.005) return;
    gain.gain.linearRampToValueAtTime(peakVol, time + 0.02); 
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration - 0.1);
    osc.start(time); osc.stop(time + duration);
    activeOscs.push(osc); 
};

        if (finalVol <= 0.01) return;

            if (pianoRef.current) { try { pianoRef.current.play(midi, t, { duration: dur, gain: g }); } catch(e){} }

        };

            const graceOffset = 0.08; 
            raw.graceNotes.forEach((p, i) => {
                const midi = getMidiNote(p);
                if (midi !== -1) {
                    const gTime = time - ((raw.graceNotes.length - i) * graceOffset);
                    playSingleNote(midi, gTime, 0.5, finalVol * 0.75);
                }
            });
        }

        let isTied = false;
        if (raw.tie === "continue" || raw.tie === "stop") isTied = true;
        if (Array.isArray(raw.tie) && (raw.tie.includes("continue") || raw.tie.includes("stop"))) isTied = true;

    const enrichedEvents = useMemo(() => {
        const timeSig = headerInfo.timeSignature || "4/4";
        const parts = timeSig.split('/').map(Number);
        const beatsPerMeasure = parts[0] || 4;
        const beatValue = parts[1] || 4; 
        
        const quarterNotesPerBeat = 4 / beatValue;
        const expectedMeasureLengthQ = beatsPerMeasure * quarterNotesPerBeat;
        
        const measureStartQs = {};
        let currentQ = 0;
        const maxM = Math.max(...unrolledEvents.map(e => e.m), 1);
        const measureShifts = {};
        
        for (let m = 1; m <= maxM; m++) {
            measureStartQs[m] = currentQ;
            const eventsInM = unrolledEvents.filter(e => e.m === m);
            let maxQInM = 0;
            eventsInM.forEach(ev => {
                const durR = ev.raw_r ? getDurationQ(ev.raw_r) : 0;
                const durL = ev.raw_l ? getDurationQ(ev.raw_l) : 0;
                const endQ = (ev.b - 1) + Math.max(durR, durL);
                if (endQ > maxQInM) maxQInM = endQ;
            });
            let length = expectedMeasureLengthQ;
            if (maxQInM > 0 && maxQInM < expectedMeasureLengthQ - 0.01) { length = maxQInM; }
            currentQ += length;
            if (m === 1 && length < expectedMeasureLengthQ) { measureShifts[1] = expectedMeasureLengthQ - length; }
        }

        let lastMidiR = null; let lastMidiL = null;
        const getRelText = (prevMidi, currMidi) => {
            if (prevMidi === null || currMidi === null || prevMidi === -1 || currMidi === -1) return { disp: "", speech: "" };
            const diff = currMidi - prevMidi; const abs = Math.abs(diff);
            if (abs < 5) return { disp: "", speech: "" };
            let dirDisp = diff > 0 ? "高い" : "低い"; let dirSpeech = diff > 0 ? "たかい" : "ひくい";
            if (abs >= 5 && abs <= 11) return { disp: `(少し${dirDisp})`, speech: `すこし${dirSpeech}、` };
            if (abs >= 12 && abs <= 23) return { disp: `(1oct${dirDisp})`, speech: `１オクターブ${dirSpeech}、` };
            if (abs >= 24) return { disp: `(2oct${dirDisp})`, speech: `２オクターブ${dirSpeech}、` };
            return { disp: "", speech: "" };
        };

        return unrolledEvents.map(ev => {
            const shiftQ = measureShifts[ev.m] || 0;
            const actualOffsetQ = (ev.b - 1) + shiftQ;
            const musicalBeat = 1 + (actualOffsetQ / quarterNotesPerBeat);
            const displayBeat = Number.isInteger(musicalBeat) ? musicalBeat.toString() : musicalBeat.toFixed(2).replace(/\.?0+$/, '');
            const absoluteQ = measureStartQs[ev.m] + (ev.b - 1);

                const midis = ev.raw_l.pitches.map(getMidiNote).filter(m => m !== -1);
                if (midis.length > 0) currentLowestL = Math.min(...midis);
            }
            const relL = getRelText(lastMidiL, currentLowestL);
            if (currentLowestL !== null) lastMidiL = currentLowestL;

            if (key === '+' || key === ';') { updateTempo(prev => prev + 5); return; }
            if (key === '-' || key === '_') { updateTempo(prev => prev - 5); return; }

            if (e.key === 'ArrowLeft') { 
                e.preventDefault(); if (playing) stopPlayback();
                setMeasure(m => { 
                    const currentStep = (m === 1) ? 1 : (blockSize === 'all' ? 1 : blockSize);
                    const prevM = Math.max(0, m - currentStep); 
                    speakMeasureInfo(prevM); // 👈 超スッキリ！
                    return prevM; 
                });
                setHighlightId(null); return; 
            }
            if (e.key === 'ArrowRight') { 
                e.preventDefault(); if (playing) stopPlayback();

                    const currentStep = (m === 0) ? 1 : (blockSize === 'all' ? 1 : blockSize);

                    speakMeasureInfo(nextM); // 👈 超スッキリ！
                    return nextM; 
                });
                setHighlightId(null); return; 
            }

                    const targetOriginal = parseInt(newJump);

                    } else {

                            speakMeasureInfo(targetEvent.m);
                        }
                    }
                    setJumpInput("");
                }, 800);
            }

                        <button onClick={() => { 
                            setTabletLayout(prev => {
                                const nextState = prev === 'split' ? 'score_only' : (prev === 'score_only' ? 'control_only' : 'split');
                                if (nextState === 'split') speak("楽譜と操作画面の、分割表示です。");
                                else if (nextState === 'score_only') speak("楽譜画面です。");
                                else speak("操作画面です。");
                                return nextState;
                            }); 
                        }} className="text-slate-300 hover:text-white font-bold py-1 px-3 border border-slate-600 rounded-lg text-xs flex items-center relative z-50 pointer-events-auto cursor-pointer" title="レイアウト切替">
                            🌗 左右分割<span className="key-guide-inline ml-1 bg-black/40 text-yellow-300 border-yellow-300/50">M</span>
                        </button>
                    </div>
                )}
                
                {/* 👇 モバイルで楽譜に戻る＋喋る */}
                <button onClick={() => { setMobileView('score'); speak("楽譜画面です。"); }} className="md:hidden w-full bg-yellow-400 text-yellow-900 font-bold py-3 rounded-xl shadow-md active:scale-95 text-base flex justify-center items-center relative">
                    🔙 楽譜に戻る<span className="key-guide-inline key-guide-dark ml-2">M</span>
                </button>                <div className="flex flex-col gap-3">
                    {extraControlsJSX}
                    <div className="md:hidden w-full px-2 text-slate-300 mt-1">
                        <div className="flex justify-between text-[10px] px-1 text-slate-400 font-bold mb-1"><label>スライドまたは、テンキーで小節番号を入力して小節移動 (0で曲情報)</label></div>
                        <input type="range" className="w-full cursor-pointer" min="0" max={maxMeasure} value={measure} 
                        onChange={e => {
                            if (playing) stopPlayback(); 
                            const val = Number(e.target.value); 
                            setMeasure(val); 
                            setHighlightId(null);
                            speakMeasureInfo(val); // 👈 超スッキリ！
                        }} />
                    </div>
                </div>

                <div className="grid grid-cols-3 gap-2 flex-1 min-h-[180px]">
                    <div></div>
                    <button id="btn-up" onClick={()=>playStepAction(currentEvents[Math.max(0, currentIndex-1)])} className="btn-large h-full py-1 bg-blue-700 text-white border-b-4 border-blue-900 relative flex flex-col items-center justify-center">
                        {/* 👇 hidden md:block を削除しました！ */}
                        <span className="key-guide-inline absolute top-1 right-1 text-[10px] leading-none px-1">↑</span>
                        <span className="text-xl">⬆️</span><span className="text-[11px] font-bold">1音戻る</span>
                    </button>
                    <div></div>
                    
                    <button id="btn-left" onClick={()=>{
                        if (playing) stopPlayback(); 
                        const step = (measure === 1) ? 1 : (blockSize === 'all' ? 1 : blockSize); 
                        setMeasure(m=>{ 
                            const prevM = Math.max(0, m - step); 
                            speakMeasureInfo(prevM);
                            return prevM; 
                        }); 
                        setHighlightId(null);
                    }} className="btn-large h-full py-1 bg-slate-700 text-white border-b-4 border-slate-900 relative flex flex-col items-center justify-center">
                        {/* 👇 hidden md:block を削除！ */}
                        <span className="key-guide-inline absolute top-1 right-1 text-[10px] leading-none px-1">←</span>
                        <span className="text-2xl">⬅️</span><span className="text-[11px] font-bold">前の小節</span>
                    </button>
                    
                    <button id="btn-replay" onClick={()=>{ playStepAction(currentEvents[currentIndex >= 0 ? currentIndex : 0]); }} className="flex flex-col items-center justify-center bg-indigo-900 rounded-2xl border-2 border-indigo-400 text-indigo-100 relative shadow-inner active:scale-95 transition-all cursor-pointer">                        {/* 👇 hidden md:block を削除！ */}
                        <span className="key-guide-inline absolute top-1 right-1 text-[10px] leading-none px-1">BS</span>
                        <span className="text-2xl mb-1">🔄</span><span className="text-[11px] font-bold">もう一度</span>
                    </button>
                    
                    <button id="btn-right" onClick={()=>{
                        if (playing) stopPlayback(); 
                        const step = (measure === 0) ? 1 : (blockSize === 'all' ? 1 : blockSize); 
                        setMeasure(m=>{ 
                            const nextM = Math.min(maxMeasure, m + step); 
                            speakMeasureInfo(nextM);
                            return nextM; 
                        }); 
                        setHighlightId(null);
                    }} className="btn-large h-full py-1 bg-slate-700 text-white border-b-4 border-slate-900 relative flex flex-col items-center justify-center">
                        {/* 👇 hidden md:block を削除！ */}
                        <span className="key-guide-inline absolute top-1 right-1 text-[10px] leading-none px-1">→</span>
                        <span className="text-2xl">➡️</span><span className="text-[11px] font-bold">次の小節</span>
                    </button>
                    
                    <div></div>
                    <button id="btn-down" onClick={()=>playStepAction(currentEvents[Math.min(currentEvents.length-1, currentIndex+1)])} className="btn-large h-full py-1 bg-blue-700 text-white border-b-4 border-blue-900 relative flex flex-col items-center justify-center">
                        {/* 👇 hidden md:block を削除！ */}
                        <span className="key-guide-inline absolute top-1 right-1 text-[10px] leading-none px-1">↓</span>
                        <span className="text-xl">⬇️</span><span className="text-[11px] font-bold">1音進む</span>
                    </button>
                    <div></div>
                </div>

                <div className="shrink-0 mt-1 md:mt-auto">
                    <button onClick={togglePlay} className={`w-full h-16 md:h-20 rounded-2xl flex items-center justify-center gap-3 text-xl md:text-2xl font-black shadow-lg border-b-8 active:translate-y-2 transition-all relative ${playing?'bg-red-600 border-red-800':'bg-green-600 border-green-800'}`}>
                        {/* 👇 hidden md:block を削除！スマホでもSpaceキー表示が出ます */}
                        <span className="key-guide-inline absolute top-2 right-3 text-sm">Space</span>
                        {isPianoLoading ? <span className="animate-pulse">🎹 音源準備中...</span> : (playing?'⏹️ 停止':'▶️ 再生')}
                    </button>
                </div>
            </section>
        </main>

        {showGuide && (
            <div role="dialog" aria-modal="true" aria-label="操作ガイド" className="fixed top-1/2 left-1/2 -translate-y-1/2 -translate-x-1/2 w-[95%] max-w-md bg-slate-800/95 backdrop-blur border border-slate-600 rounded-xl shadow-2xl z-[60] p-4 text-slate-200 text-xs">
                <div className="sr-only">操作ガイドを開きました。ジェスチャー操作：1本指の左右スワイプで1おん移動。2本指の左右スワイプで小節移動。3本指スワイプでモード切替。画面の長押しでもう一度読み上げ。ダブルタップで再生と停止。右上の閉じるボタンでこのガイドを非表示にできます。</div>
                <button onClick={() => setShowGuide(false)} aria-label="ガイドを閉じる" className="absolute -top-3 -right-3 w-8 h-8 bg-slate-700 rounded-full border border-slate-500 flex items-center justify-center text-white shadow-lg text-sm font-black">✕</button>
                <div className="font-black text-blue-400 mb-2 text-center text-sm tracking-wide" aria-hidden="true">💡 操作ガイド</div>
                <div className="grid grid-cols-2 gap-4" aria-hidden="true">
                    <div>
                        <div className="text-center text-yellow-300 font-bold border-b border-slate-600 mb-1 pb-1">👆 ジェスチャー</div>
                        <div className="grid grid-cols-[auto_1fr] gap-x-2 gap-y-1 text-[10px]">
                            <span className="text-right text-slate-400 font-bold">Wタップ</span><span className="font-bold text-green-400">再生/停止</span>
                            <span className="text-right text-slate-400 font-bold">長押し</span><span className="font-bold">もう一度(1音)</span>
                            <span className="text-right text-slate-400 font-bold">1本指 左右</span><span className="font-bold">1音 移動</span>
                            <span className="text-right text-slate-400 font-bold">2本指 左右</span><span className="font-bold">小節 移動</span>
                        </div>
                    </div>
                    <div>
                        <div className="text-center text-pink-300 font-bold border-b border-slate-600 mb-1 pb-1">⌨️ キーボード</div>
                        <div className="grid grid-cols-[auto_1fr] gap-x-2 gap-y-1 text-[10px]">
                            <span className="text-right text-slate-400 font-bold">Space</span><span className="font-bold text-green-400">再生/停止</span>
                            <span className="text-right text-slate-400 font-bold">BS</span><span className="font-bold">もう一度(1音)</span>
                            <span className="text-right text-slate-400 font-bold">矢印 ↑↓</span><span className="font-bold">1音 移動</span>
                            <span className="text-right text-slate-400 font-bold">矢印 ←→</span><span className="font-bold">小節 移動</span>
                            <span className="text-right text-slate-400 font-bold">S/G/M</span><span className="font-bold">設定/ガイド/切替</span>
                        </div>
                    </div>
                </div>
                <div className="mt-3 text-center text-[9px] text-slate-500" aria-hidden="true">※ 左上の設定メニューから再表示できます</div>
            </div>
        )}
      </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
